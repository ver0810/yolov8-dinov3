# V1 mixed pool (2838) — DEIMv2 HGNetv2-L 32.2M @640 (stable) vs N
__include__: [
  '../dataset/custom_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  'deimv2_hgnetv2_l_coco.yml'
]

output_dir: ./outputs/v1_mixed_L_640

remap_mscoco_category: false

eval_spatial_size: [640, 640]

train_dataloader:
  dataset:
    img_folder: /
    ann_file: /home/ancheng/Code/yolov8-dinov3/outputs/deim_smoke/coco/train_mixed.json
    transforms:
      policy:
        epoch: 100
  total_batch_size: 4
  num_workers: 4
  collate_fn:
    mixup_prob: 0.0
    copyblend_prob: 0.0
    base_size: 640
    base_size_repeat: 4

val_dataloader:
  dataset:
    img_folder: /home/ancheng/dataset/dataset_split/val/images
    ann_file: /home/ancheng/Code/yolov8-dinov3/outputs/deim_smoke/coco/val.json
    transforms:
      ops:
        - {type: Resize, size: [640, 640], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  total_batch_size: 8
  num_workers: 4

epoches: 20
optimizer:
  lr: 0.0001
