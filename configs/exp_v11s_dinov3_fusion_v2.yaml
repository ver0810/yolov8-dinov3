exp_name: "027_yolo11s_dinov3_fusion_v2"
mode: yolo_family
# Fusion YAML with 5-arg form: dino_ckpt points to Stage-1 best.pt
# The YAML itself uses 4-arg (random init); we override via --model below.
#
# For Stage-2 with calibrated DINO proj, use:
#   uv run python scripts/train.py --config configs/exp_v11s_dinov3_fusion_v2.yaml \
#       --model third_party/ultralytics/ultralytics/cfg/models/v8/yolov8-dinov3-fusion.yaml
#
# The dino_ckpt path is baked into the YAML backbone args.
# To switch between random-init and Stage-1 init, edit the YAML line 16.

yolo_model: third_party/ultralytics/ultralytics/cfg/models/v8/yolov8-dinov3-fusion.yaml

data_config: configs/own_dataset.yaml
output_dir: outputs/runs

img_size: 640
batch_size: 2
epochs: 100
lr: 0.001
patience: 100
