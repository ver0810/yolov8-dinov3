[project]
name = "yolo-dino"
version = "0.1.0"
description = "YOLOv8 + DINOv3 backbone fusion for industrial textile defect detection"
requires-python = "~=3.11.0"
dependencies = [
    "torch>=2.5.0,<2.6.0",
    "torchvision>=0.20.0,<0.21.0",
    "numpy>=1.26,<2.1",
    "ultralytics",
    "einops>=0.8.0",
    "safetensors>=0.4.5",
    "huggingface-hub>=0.25.0",
    "timm>=1.0.9",
    "opencv-python-headless>=4.10.0,<4.11",
    "pillow>=10.4.0",
    "albumentations>=1.4.10,<2.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.5.0",
    "tensorboard>=2.17.0",
    "pyyaml>=6.0.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
]
lora = [
    "peft>=0.12.0",
]

[tool.uv]
package = false

[tool.uv.sources]
ultralytics = { path = "third_party/ultralytics", editable = true }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
