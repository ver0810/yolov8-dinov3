[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yolo-dino"
version = "0.1.0"
description = "YOLOv8 + DINOv3 backbone fusion for industrial textile defect detection"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/yolo_dino"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
